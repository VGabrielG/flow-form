<div class="min-h-screen flex flex-col relative bg-white">
    <!-- Background Dot Grid -->
    <div class="fixed inset-0 bg-grid-technical pointer-events-none z-0 opacity-[0.03]"></div>

    <canvas #canvasRef class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div class="min-h-screen bg-transparent pt-32 pb-24 px-4 relative z-10">
        <div class="max-w-3xl mx-auto">
            <div class="text-center mb-16">
                <h1 class="text-5xl font-black text-neutral-900 mb-6 uppercase tracking-tight">
                    {{ lang.t('nav_contact') }}
                </h1>
                <p class="text-xl text-neutral-500 font-medium">
                    Get in touch with our team for inquiries and support.
                </p>
            </div>

            <div class="bg-neutral-50 rounded-[2.5rem] p-10 md:p-16 border border-neutral-100 shadow-xl">
                <form class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-neutral-400 pl-4">Name</label>
                            <input
                                class="w-full bg-white border border-neutral-200 rounded-2xl px-6 py-4 text-neutral-900 font-medium focus:outline-none focus:border-neutral-400 transition-colors"
                                placeholder="John Doe" type="text" />
                        </div>
                        <div class="space-y-2">
                            <label
                                class="text-xs font-black uppercase tracking-widest text-neutral-400 pl-4">Email</label>
                            <input
                                class="w-full bg-white border border-neutral-200 rounded-2xl px-6 py-4 text-neutral-900 font-medium focus:outline-none focus:border-neutral-400 transition-colors"
                                placeholder="john@example.com" type="email" />
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label
                            class="text-xs font-black uppercase tracking-widest text-neutral-400 pl-4">Message</label>
                        <textarea rows="6"
                            class="w-full bg-white border border-neutral-200 rounded-2xl px-6 py-4 text-neutral-900 font-medium focus:outline-none focus:border-neutral-400 transition-colors resize-none"
                            placeholder="How can we help you?"></textarea>
                    </div>

                    <button type="button"
                        class="w-full bg-neutral-950 text-white font-black uppercase tracking-[0.2em] py-5 rounded-2xl hover:bg-neutral-800 transition-colors shadow-lg">
                        Send Message
                    </button>
                </form>

                <div class="mt-16 pt-16 border-t border-neutral-200 grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                    <div>
                        <h3 class="font-black uppercase tracking-widest text-xs text-neutral-400 mb-2">Email</h3>
                        <p class="font-medium text-neutral-900">info@flowform.net</p>
                    </div>
                    <div>
                        <h3 class="font-black uppercase tracking-widest text-xs text-neutral-400 mb-2">Phone</h3>
                        <p class="font-medium text-neutral-900">+1 (555) 123-4567</p>
                    </div>
                    <div>
                        <h3 class="font-black uppercase tracking-widest text-xs text-neutral-400 mb-2">Location</h3>
                        <p class="font-medium text-neutral-900">New York, USA</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
