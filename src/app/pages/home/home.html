<div class="min-h-screen flex flex-col relative bg-white">
    <!-- Background Dot Grid -->
    <div class="fixed inset-0 bg-grid-technical pointer-events-none z-0 opacity-[0.03]"></div>

    <canvas #canvasRef class="fixed inset-0 pointer-events-none z-0"></canvas>

    <main class="flex-grow relative z-10 pt-32 pb-20">
        <div class="animate-fadeIn max-w-7xl mx-auto px-4">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tight text-neutral-900 mb-6 font-outfit">
                    Our Products
                </h1>
                <p class="max-w-2xl mx-auto text-neutral-600 font-medium leading-relaxed">
                    Explore our range of biomimetic water flow technologies designed for home, agriculture, and
                    landscaping.
                </p>
            </div>

            <div class="mb-12 space-y-8">
                <div class="max-w-xl mx-auto relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                            class="h-5 w-5 text-neutral-400 group-focus-within:text-blue-600 transition-colors">
                            <path d="m21 21-4.34-4.34"></path>
                            <circle cx="11" cy="11" r="8"></circle>
                        </svg>
                    </div>
                    <input type="text" placeholder="Search products, applications..." [value]="searchTerm()"
                        (input)="onSearchInput($event)"
                        class="block w-full pl-12 pr-4 py-4 bg-white border border-neutral-200 rounded-full text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm hover:shadow-md" />
                </div>

                <div class="flex flex-wrap justify-center gap-3">
                    <button *ngFor="let tab of tabs" (click)="activeTab.set(tab.id)"
                        class="px-5 py-2.5 rounded-full text-sm font-bold uppercase tracking-wide transition-all duration-300 border"
                        [ngClass]="activeTab() === tab.id ? 'bg-neutral-950 text-white border-neutral-900 shadow-lg transform scale-105' : 'bg-white text-neutral-600 border-neutral-200 hover:border-neutral-400 hover:text-neutral-900 hover:shadow-md'">
                        {{ tab.label }}
                    </button>
                </div>
            </div>

            <div class="space-y-20">
                <ng-container *ngFor="let category of categories">
                    <div *ngIf="filteredModels()[category.id].length > 0" class="space-y-8">
                        <div class="flex items-center gap-4">
                            <h2 class="text-2xl font-black uppercase tracking-wider text-neutral-900 whitespace-nowrap">
                                {{ category.title }}</h2>
                            <div class="h-px bg-neutral-200 w-full"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                            <div *ngFor="let model of filteredModels()[category.id]"
                                (click)="navigateDetails(category.id, model.id)"
                                class="group relative h-96 rounded-[3rem] overflow-hidden shadow-2xl transition-transform duration-500 hover:-translate-y-4 cursor-pointer">
                                <img [src]="model.imageUrl" [alt]="model.name"
                                    class="absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" />
                                <div
                                    class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent">
                                </div>

                                <div *ngIf="model.price" class="absolute top-8 right-8 z-20">
                                    <span
                                        class="inline-block px-4 py-1.5 bg-black/50 backdrop-blur-md text-white text-[10px] font-black uppercase tracking-widest rounded-full border border-white/10 shadow-lg group-hover:bg-blue-600 group-hover:border-blue-500 transition-colors">
                                        {{ model.price }}
                                    </span>
                                </div>

                                <div class="absolute bottom-10 left-10 right-10 text-left z-20">
                                    <h3
                                        class="text-3xl font-black text-white mb-4 leading-none group-hover:text-blue-400 transition-colors shadow-black drop-shadow-lg">
                                        {{ model.name }}
                                    </h3>
                                    <p
                                        class="text-gray-200 text-sm line-clamp-2 mb-6 font-medium leading-relaxed drop-shadow-md opacity-90">
                                        {{ model.description }}
                                    </p>
                                    <div
                                        class="inline-flex items-center space-x-3 text-white font-black uppercase tracking-widest text-[10px] group-hover:translate-x-2 transition-transform">
                                        <span>VIEW DETAILS</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
                                            strokeLinecap="round" strokeLinejoin="round" class="w-4 h-4">
                                            <path d="M5 12h14"></path>
                                            <path d="m12 5 7 7-7 7"></path>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </main>
</div>
